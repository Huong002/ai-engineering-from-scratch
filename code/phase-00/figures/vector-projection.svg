<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Minh họa vector và phép chiếu</title>
  <desc id="desc">Vector a được tách thành hình chiếu trên hướng vector b và phần dư vuông góc với b.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 Z" fill="#ea580c"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 Z" fill="#16a34a"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 Z" fill="#9333ea"/></marker>
  </defs>
  <rect width="900" height="560" rx="24" fill="#f8fafc"/>
  <text x="450" y="54" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#0f172a">Hình chiếu của vector a lên hướng b</text>
  <line x1="110" y1="420" x2="780" y2="420" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="150" y1="465" x2="150" y2="105" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="150" cy="420" r="6" fill="#0f172a"/>
  <text x="126" y="450" font-family="sans-serif" font-size="20" fill="#334155">O</text>
  <!-- b direction -->
  <line x1="150" y1="420" x2="690" y2="420" stroke="#ea580c" stroke-width="7" marker-end="url(#arrow-orange)"/>
  <text x="708" y="428" font-family="sans-serif" font-size="25" font-weight="700" fill="#c2410c">b (hướng chiếu)</text>
  <!-- a -->
  <line x1="150" y1="420" x2="465" y2="150" stroke="#2563eb" stroke-width="7" marker-end="url(#arrow-blue)"/>
  <text x="472" y="139" font-family="sans-serif" font-size="26" font-weight="700" fill="#1d4ed8">a</text>
  <!-- projection -->
  <line x1="150" y1="420" x2="465" y2="420" stroke="#16a34a" stroke-width="7" marker-end="url(#arrow-green)"/>
  <text x="300" y="457" font-family="sans-serif" font-size="22" font-weight="700" fill="#15803d">proj_b(a)</text>
  <!-- residual -->
  <line x1="465" y1="420" x2="465" y2="150" stroke="#9333ea" stroke-width="6" stroke-dasharray="12 9" marker-end="url(#arrow-purple)"/>
  <text x="482" y="295" font-family="sans-serif" font-size="21" font-weight="700" fill="#7e22ce">phần dư r</text>
  <!-- right angle -->
  <path d="M465 395 L440 395 L440 420" fill="none" stroke="#334155" stroke-width="3"/>
  <text x="420" y="388" font-family="sans-serif" font-size="18" fill="#475569">90°</text>
  <!-- angle -->
  <path d="M220 420 A70 70 0 0 0 203 374" fill="none" stroke="#64748b" stroke-width="3"/>
  <text x="226" y="395" font-family="serif" font-size="24" font-style="italic" fill="#475569">θ</text>
  <!-- legend -->
  <rect x="150" y="495" width="600" height="42" rx="12" fill="#e2e8f0"/>
  <text x="450" y="523" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">a = hình chiếu proj_b(a) + phần dư r; phần dư vuông góc với b</text>
</svg>
